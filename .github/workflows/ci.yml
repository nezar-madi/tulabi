# Runs on every push to main and on pull requests (mirrors rqmana's CI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']   # 8.5 is what the servers will run; 8.3 is the minimum
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3, sodium, exif, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: App key
        run: cp .env.example .env && php artisan key:generate --no-interaction

      # Tests use in-memory SQLite (phpunit.xml): no database service needed.
      - run: php artisan test

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The frontend imports Ziggy from vendor/tightenco/ziggy, so the PHP packages
      # must be installed before the build (the server will do the same, in that order).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'   # same as the servers will run
          extensions: mbstring, intl, gd, zip, bcmath, sodium, exif, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-dev --no-scripts --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Includes: every translation string compiles, every tabler: icon is registered.
      - run: npm run test:js

      - run: npm run build
